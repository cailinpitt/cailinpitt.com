name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Periods complete on their own schedule — a week every Monday, a month every
  # month — and scripts/bake-listening.mjs only captures the ones that exist at
  # build time. Without this, the newest completed periods stay unbaked until
  # some unrelated commit happens to trigger a deploy, so the optimisation
  # decays quietly the longer you go without pushing.
  #
  # Mondays, shortly after the week rolls over in US Central.
  schedule:
    - cron: '30 9 * * 1'
  # Called by ingest-photos.yml after it commits a photo from the phone. That
  # push is made with the default GITHUB_TOKEN, and GitHub deliberately does not
  # let such a push trigger `on: push` — it's the loop guard. So the ingest
  # workflow has to ask for the deploy explicitly rather than causing one.
  workflow_call:
    inputs:
      ref:
        description: >-
          Branch or SHA to build. Left empty for push and manual runs, which
          check out the commit that triggered them. The ingest workflow passes
          `main`, because the commit it wants deployed is one it made *during*
          this run — the triggering SHA predates it.
        type: string
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          # Full history, not the default shallow clone: the provenance line at
          # the foot of each post is read from `git log` at build time (see the
          # cailinpitt:post-history plugin in vite.config.ts). At depth 1 every
          # post would claim to have been added in the most recent commit.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
