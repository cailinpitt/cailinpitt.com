name: Note OG card

# Renders one note's social card and uploads it to R2. Fired by worker-notes on
# publish/edit (see dispatchOgCard in worker-notes/src/index.ts) — this can't
# happen in the Worker itself, which has nowhere near the CPU budget for image
# rendering. No commit and no deploy: nothing here touches a git-tracked file.
on:
  repository_dispatch:
    types: [note-published]

jobs:
  card:
    runs-on: ubuntu-latest
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/generate-note-og.mjs --id "${{ github.event.client_payload.id }}"
