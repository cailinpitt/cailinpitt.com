<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- Feed autodiscovery, on every page rather than just /blog, so a reader
         subscribed from anywhere on the site finds it. Written by scripts/generate-rss.mjs. -->
    <link rel="alternate" type="application/rss+xml" title="Cailin Pitt — Blog" href="/feed.xml" />
    <!-- Browser chrome tint. Matches the page background rather than the accent, so
         the toolbar reads as an extension of the paper instead of a clay band above
         it. Two media-scoped tags cover System with no JS; a manual override can't
         be seen by a media query, so ThemeToggle rewrites these after mount. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#faf8f4" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141312" />
    <!-- Apply the saved color theme before first paint to avoid a flash of the wrong
         theme (FOUC). Mirrors src/components/ThemeToggle.tsx. System = no attribute. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme')
          if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
        } catch (e) {}
      })()
    </script>
    <!-- Per-page <title>, description, canonical, and Open Graph tags are injected by <Seo>. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Cloudflare Web Analytics (cookieless). Token is public by design. -->
    <script defer src="https://static.cloudflareinsights.com/beacon.min.js"
            data-cf-beacon='{"token": "5944ea28813d430c92ff43c11c53ebf5"}'></script>
  </body>
</html>
